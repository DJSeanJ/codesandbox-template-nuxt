[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djtag"
version = "0.1.0"
description = "DJ Sean J's library ID3 normalizer: album date prefix + canonical genre tags."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sean J", email = "Sean@djseanj.com" }]
dependencies = [
    "mutagen>=1.47",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-Levenshtein>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
djtag = "djtag.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["djtag*"]

[tool.setuptools.package-data]
djtag = ["../canonical_tags.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
